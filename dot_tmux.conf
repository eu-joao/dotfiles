# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Terminal e prefixo                                                         │
# └────────────────────────────────────────────────────────────────────────────┘
set -g prefix C-b                           # tecla de prefixo (padrão do tmux)
set -g status-position top                  # barra de status no topo da tela
set -g mouse on                             # permite clicar em painéis e rolar com o mouse
set -g history-limit 10000                  # igual ao UXTerm*saveLines
set -g default-terminal "xterm-256color"    # habilita 256 cores + true color
set -ga terminal-overrides ",xterm-256color:Tc"  # suporte a true color (16M cores)
set -s set-clipboard on                     # OSC 52 → clipboard do X11 (uxterm)

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Recarregar configuração                                                    │
# └────────────────────────────────────────────────────────────────────────────┘
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"   # prefixo + r → recarrega este arquivo

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Modo de cópia (atalhos estilo nvim)                                        │
# └────────────────────────────────────────────────────────────────────────────┘
# Só vale DENTRO do modo de cópia (prefixo+[).
# No shell/nvim normal as teclas continuam iguais — o tmux não as rouba.
# Entrar: prefixo+[ | Sair: q ou Esc | Buscar: / (frente) ? (trás)
setw -g mode-keys vi                        # hjkl, w/b, 0/$ , f/t, etc. como no nvim

# ── Seleção e yank ────────────────────────────────────────────────────────────
# v → visual | Ctrl+v → bloco | y → clipboard | mouse solto → clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Tema (estilo Herdr)                                                        │
# └────────────────────────────────────────────────────────────────────────────┘
# Para trocar de tema, mude o nome do arquivo de cores (o crust dele precisa
# ser igual ao fundo do terminal):
# catppuccin-mocha | dracula | gruvbox | rose-pine
source-file ~/.tmux/themes/colors/catppuccin-mocha.colors
source-file ~/.tmux/themes/herdr.conf

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Command palette (fzf · estética herdr)                                     │
# └────────────────────────────────────────────────────────────────────────────┘
# prefixo + ? → popup filtrável. Cores vêm dos @herdr-* (mesmo tema da barra).
# Fundo = crust (igual ao painel/terminal) na borda, título e miolo.
# Lista: ~/.tmux/palette.tsv | script: ~/.tmux/scripts/command-palette.sh
bind-key ? display-popup -E -w 64% -h 56% -b rounded \
  -S "fg=#{@herdr-surface1},bg=#{@herdr-crust}" \
  -s "fg=#{@herdr-text},bg=#{@herdr-crust}" \
  -T "#[fg=#{@herdr-mauve},bg=#{@herdr-crust},bold] tmux · palette " \
  "~/.tmux/scripts/command-palette.sh"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Plugins (gerenciados pelo TPM)                                             │
# └────────────────────────────────────────────────────────────────────────────┘

# ── Atalhos do TPM ────────────────────────────────────────────────────────────
# prefixo + I → instalar | prefixo + U → atualizar
# prefixo + Alt+u → desinstalar | prefixo + Alt+p → listar | prefixo + Alt+h → ajuda

set -g @plugin 'tmux-plugins/tpm'           # o próprio gerenciador de plugins
set -g @plugin 'tmux-plugins/tmux-sensible' # opções padrão mais confortáveis

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Inicialização do TPM                                                       │
# └────────────────────────────────────────────────────────────────────────────┘
# Precisa ficar por último: carrega todos os plugins declarados acima
run '~/.tmux/plugins/tpm/tpm'
