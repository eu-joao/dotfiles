# geral
set -g mouse on
# igual ao UXTerm*saveLines
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g mode-keys vi

# terminal (uxterm)
set -g default-terminal "xterm-256color"
set -s set-clipboard on
# true color + fix das teclas End/Home (vt340)
set -ga terminal-overrides ",xterm-256color:Tc,kEND=F4,kHOM=F1"
set -ga terminal-overrides ",vt340:Tc,kEND=F4,kHOM=F1"
set -ga terminal-overrides ",*256col*:Tc,kEND=F4,kHOM=F1"

# atalhos
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind Space last-window
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind g display-popup -d "#{pane_current_path}" -E -b rounded -w 81% -h 80% lazygit

# modo de cópia (só vale dentro dele)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# tema: catppuccin-mocha | dracula | gruvbox | rose-pine
# o crust do tema precisa ser igual ao fundo do terminal
source-file ~/.tmux/themes/colors/catppuccin-mocha.colors
source-file ~/.tmux/themes/herdr.conf

# palette (prefixo + ?): lista em ~/.tmux/palette.tsv
bind ? display-popup -E -w 64% -h 56% -b rounded \
  -S "fg=#{@herdr-surface1},bg=#{@herdr-crust}" \
  -s "fg=#{@herdr-text},bg=#{@herdr-crust}" \
  -T "#[fg=#{@herdr-mauve},bg=#{@herdr-crust},bold] tmux · palette " \
  "~/.tmux/scripts/command-palette.sh"

# plugins (TPM: prefixo + I instala, prefixo + U atualiza)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# precisa ficar por último
run '~/.tmux/plugins/tpm/tpm'
