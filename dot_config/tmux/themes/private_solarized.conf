# Tema Solarized Osaka
# Baseado em: https://github.com/craftzdog/solarized-osaka.nvim

# Cores principais
set -g @theme-bg "#00141A"
set -g @theme-fg "#839495"
set -g @theme-accent "#278BD3"
set -g @theme-accent-bright "#9FACAD"
set -g @theme-separator "#586E74"
set -g @theme-bg-secondary "#002D38"
set -g @theme-bg-secondary-tinted "#073541"
set -g @theme-icon-session ""

# Cores do painel de status
set -g @status-bg "#00141A"
set -g @status-fg "#839495"
set -g @status-current-bg "#002D38"
set -g @status-current-fg "#278BD3"
set -g @status-inactive-bg "#00141A"
set -g @status-inactive-fg "#647A82"

# Cores das janelas
set -g @window-active-bg "#002D38"
set -g @window-active-fg "#278BD3"
set -g @window-inactive-bg "#00141A"
set -g @window-inactive-fg "#647A82"

# Estilo do modo de comando (cor de highlight diferente da principal)
set -g mode-style "fg=#{@theme-bg},bg=#{@theme-accent}"

# Estilo das mensagens
set -g message-style "fg=#{@theme-bg},bg=#{@theme-accent}"
