# Tema Default - Tema padrão do tmux

# Cores principais
set -g @theme-bg "default"
set -g @theme-fg "default"
set -g @theme-accent "#ffffff"
set -g @theme-accent-bright "#ffffff"
set -g @theme-separator "#808080"
set -g @theme-bg-secondary "#444444"
set -g @theme-bg-secondary-tinted "#5a5a5a"
set -g @theme-icon-session ""

# Cores do painel de status
set -g @status-bg "#000000"
set -g @status-fg "#ffffff"
set -g @status-current-bg "#444444"
set -g @status-current-fg "#ffffff"
set -g @status-inactive-bg "#000000"
set -g @status-inactive-fg "#888888"

# Cores das janelas
set -g @window-active-bg "#444444"
set -g @window-active-fg "#ffffff"
set -g @window-inactive-bg "#000000"
set -g @window-inactive-fg "#888888"

# Estilo do modo de comando (cor de highlight diferente da principal)
set -g mode-style "fg=#{@theme-bg},bg=#{@theme-accent}"

# Estilo das mensagens
set -g message-style "fg=#{@theme-bg},bg=#{@theme-accent}"
