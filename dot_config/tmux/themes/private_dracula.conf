# Tema Dracula

# Cores principais
set -g @theme-bg "#282a36"
set -g @theme-fg "#f8f8f2"
set -g @theme-accent "#ff79c6"
set -g @theme-accent-bright "#ffd7f2"
set -g @theme-separator "#44475a"
set -g @theme-bg-secondary "#44475a"
set -g @theme-bg-secondary-tinted "#5a4d63"
set -g @theme-icon-session ""

# Cores do painel de status
set -g @status-bg "#282a36"
set -g @status-fg "#f8f8f2"
set -g @status-current-bg "#44475a"
set -g @status-current-fg "#ff79c6"
set -g @status-inactive-bg "#282a36"
set -g @status-inactive-fg "#6272a4"

# Cores das janelas
set -g @window-active-bg "#44475a"
set -g @window-active-fg "#ff79c6"
set -g @window-inactive-bg "#282a36"
set -g @window-inactive-fg "#6272a4"

# Estilo do modo de comando (cor de highlight diferente da principal)
set -g mode-style "fg=#{@theme-bg},bg=#{@theme-accent}"

# Estilo das mensagens
set -g message-style "fg=#{@theme-bg},bg=#{@theme-accent}"
