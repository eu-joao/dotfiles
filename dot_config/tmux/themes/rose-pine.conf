# Tema Rose Pine

# Cores principais
set -g @theme-bg "#191724"
set -g @theme-fg "#e0def4"
set -g @theme-accent "#eb6f92"
set -g @theme-accent-bright "#f7bfd0"
set -g @theme-separator "#26233a"
set -g @theme-bg-secondary "#1f1d2e"
set -g @theme-bg-secondary-tinted "#2a2135"
set -g @theme-icon-session ""

# Cores do painel de status
set -g @status-bg "#191724"
set -g @status-fg "#e0def4"
set -g @status-current-bg "#1f1d2e"
set -g @status-current-fg "#eb6f92"
set -g @status-inactive-bg "#191724"
set -g @status-inactive-fg "#6e6a86"

# Cores das janelas
set -g @window-active-bg "#1f1d2e"
set -g @window-active-fg "#eb6f92"
set -g @window-inactive-bg "#191724"
set -g @window-inactive-fg "#6e6a86"

# Estilo do modo de comando (cor de highlight diferente da principal)
set -g mode-style "fg=#{@theme-bg},bg=#{@theme-accent}"

# Estilo das mensagens
set -g message-style "fg=#{@theme-bg},bg=#{@theme-accent}"
