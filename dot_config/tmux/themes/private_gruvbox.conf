# Tema Gruvbox

# Cores principais
set -g @theme-bg "#282828"
set -g @theme-fg "#ebdbb2"
set -g @theme-accent "#fabd2f"
set -g @theme-accent-bright "#fce4a8"
set -g @theme-separator "#3c3836"
set -g @theme-bg-secondary "#3c3836"
set -g @theme-bg-secondary-tinted "#4d4136"
set -g @theme-icon-session ""

# Cores do painel de status
set -g @status-bg "#282828"
set -g @status-fg "#ebdbb2"
set -g @status-current-bg "#3c3836"
set -g @status-current-fg "#fabd2f"
set -g @status-inactive-bg "#282828"
set -g @status-inactive-fg "#928374"

# Cores das janelas
set -g @window-active-bg "#3c3836"
set -g @window-active-fg "#fabd2f"
set -g @window-inactive-bg "#282828"
set -g @window-inactive-fg "#928374"

# Estilo do modo de comando (cor de highlight diferente da principal)
set -g mode-style "fg=#{@theme-bg},bg=#{@theme-accent}"

# Estilo das mensagens
set -g message-style "fg=#{@theme-bg},bg=#{@theme-accent}"
