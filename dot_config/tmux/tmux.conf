# Caminho do arquivo de configuração principal
# O tmux deve reconhecer este arquivo como o principal

# Ativar funções com o mouse
# Permite seleção de texto, redimensionamento de janelas e navegação entre painéis
set -g mouse on

# Limite do histórico
# Definido para 10000 linhas para evitar travamentos no terminal
set -g history-limit 10000

# Numeração das janelas
# Reiniciar a numeração a cada nova sessão e começar em 1 (não em 0)
set -g base-index 1
set -g pane-base-index 1
set -w -g automatic-rename on

# Painel de status
# Posicionado na parte superior da tela
set -g status-position top

# Suporte a cores completas (true color / 24-bit)
# Permite que vim e tmux funcionem bem com todas as cores
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Ativar clipboard do sistema operacional
# Permite copiar e colar entre tmux e outros aplicativos
set -g set-clipboard on

# Configurar modo de cópia para vi
# Usa atalhos estilo vim no modo de cópia
setw -g mode-keys vi

# Atalhos de teclado estilo vim
# y para copiar (no modo de cópia visual)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Modo de seleção visual
# <leader>v para entrar no modo de seleção visual (copy-mode)
bind-key v copy-mode

# Recarregar configuração do tmux
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Configuração recarregada!"

# Criar nova janela no path atual
bind-key c new-window -c "#{pane_current_path}"

# Dividir janela verticalmente no mesmo path
bind-key | split-window -h -c "#{pane_current_path}"

# Dividir janela horizontalmente no mesmo path
bind-key - split-window -v -c "#{pane_current_path}"

# Navegação entre painéis
bind-key l select-pane -R
bind-key h select-pane -L
bind-key k select-pane -U
bind-key j select-pane -D

# Carregar o tema
source-file ~/.config/tmux/themes/rose-pine.conf

# Evitar que a barra herde as cores padrão do tmux
set -g status-style "fg=#{@status-fg},bg=#{@status-bg}"

# Ativar painel de status
set -g status on
set -g status-position top

# Fundo transparente do tmux para permitir o fundo do terminal ser visível
set -g status-style "fg=#{@theme-fg},bg=default"
set -g window-status-style "fg=#{@window-inactive-fg},bg=#{@theme-bg}"
set -g window-status-current-style "fg=#{@window-active-fg},bg=#{@theme-bg-secondary}"
set -g window-status-separator " "
set -g pane-border-style "fg=#{@theme-bg}"
set -g pane-active-border-style "fg=#{@theme-accent},bg=default"
set -g pane-border-status top
set -g pane-border-format ""

# Sessão no canto esquerdo
set -g status-left "#[fg=#{@theme-accent},bg=#{@theme-bg-secondary-tinted}] #{@theme-icon-session} #S #[default] #[default]"
set -g status-left-length 20

# Janelas no painel de status
# Janelas inativas: fundo transparente (mesmo que background do tema)
# Janela ativa: fundo com cor tinted (mesmo estilo do módulo do canto direito)
# Numeração antes do ícone em todas as janelas, espaçamento de 1 caractere
set -g window-status-format "#[fg=#{@window-inactive-fg},bg=default] #I #(/home/abacate/.config/tmux/scripts/get_window_icon.sh #{window_name}) #W #[default]"
set -g window-status-current-format "#[fg=#{@window-active-fg},bg=#{@theme-bg-secondary-tinted}] #I #(/home/abacate/.config/tmux/scripts/get_window_icon.sh #{window_name}) #W #[default]"

# Lado direito do painel de status
# Sem relógio/data; exibe o host@user com fundo secundário tingido pela cor de destaque e texto em tom claro
set -g status-right "#[fg=#{@theme-accent-bright},bg=#{@theme-bg-secondary-tinted}] #{host_short}@#(whoami) #[default]"
set -g status-right-length 30

# Plugins
# TPM e tmux-sensible
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Inicializar TPM
run '~/.config/tmux/plugins/tpm/tpm'
