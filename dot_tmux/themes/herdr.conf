# ┌────────────────────────────────────────────────────────────────────────────┐
# │ herdr.conf                                                                 │
# └────────────────────────────────────────────────────────────────────────────┘
# Tema do tmux inspirado no herdr.dev. Cores em herdr.colors.
# "set -gF" troca as cores na hora de carregar (mais leve que refazer a cada
# desenho). Onde há "#{?...}" (depende do estado) o "-F" não pode ser usado.

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Paleta                                                                     │
# └────────────────────────────────────────────────────────────────────────────┘
source-file ~/.tmux/themes/herdr.colors

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Barra de status                                                            │
# └────────────────────────────────────────────────────────────────────────────┘
set -g status on                            # mostra a barra
set -g status-position top                  # no topo, como a barra de abas do herdr
set -g status-justify left                  # abas alinhadas à esquerda
set -g status-interval 15                   # atualiza a cada 15s (o relógio só mostra minutos)
set -gF status-style "fg=#{@herdr-overlay1},bg=#{@herdr-base}"   # fundo e texto padrão
set -g status-left-length 40                # espaço máximo do lado esquerdo
set -g status-right-length 60               # espaço máximo do lado direito

# ── Esquerda ──────────────────────────────────────────────────────────────────
# Bolinha + nome da sessão (como os "spaces" do herdr). Fica vermelha quando
# o prefixo (Ctrl+b) foi pressionado.
set -g status-left "#{?client_prefix,#[fg=#{@herdr-red}],#[fg=#{@herdr-mauve}]} ● #[fg=#{@herdr-text}]#[bold]#S #[nobold]#[fg=#{@herdr-surface2}]│"

# ── Direita ───────────────────────────────────────────────────────────────────
# Hora e nome da máquina
set -g status-right "#[fg=#{@herdr-subtext0}]%H:%M #[fg=#{@herdr-surface2}]│ #[fg=#{@herdr-green}]#H "

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Abas (janelas)                                                             │
# └────────────────────────────────────────────────────────────────────────────┘
set -g window-status-separator ""           # sem espaço extra entre as abas
set -g window-status-format " #I #W "       # aba inativa
set -g window-status-current-format " #I #W "   # aba ativa (a cor vem do estilo abaixo)
set -gF window-status-style "fg=#{@herdr-overlay1},bg=#{@herdr-base}"        # inativa: apagada
set -gF window-status-current-style "fg=#{@herdr-crust},bg=#{@herdr-mauve},bold"   # ativa: bloco lilás
set -gF window-status-activity-style "fg=#{@herdr-yellow},bg=#{@herdr-base}" # aba com atividade nova
set -gF window-status-bell-style "fg=#{@herdr-red},bg=#{@herdr-base}"        # aba que tocou o sino

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Painéis                                                                    │
# └────────────────────────────────────────────────────────────────────────────┘
# O fundo escuro (crust) cobre o painel inteiro, igual à área principal do
# herdr. Para voltar ao fundo do terminal, apague as duas linhas de "window".
set -gF window-style "fg=#{@herdr-text},bg=#{@herdr-crust}"          # painel inativo
set -gF window-active-style "fg=#{@herdr-text},bg=#{@herdr-crust}"   # painel ativo
set -g pane-border-lines single             # traço fino (o tmux 3.4 não tem borda arredondada)
set -gF pane-border-style "fg=#{@herdr-surface1},bg=#{@herdr-crust}"          # borda inativa
set -gF pane-active-border-style "fg=#{@herdr-mauve},bg=#{@herdr-crust}"      # borda ativa
# Título dentro da borda, como o herdr faz ("claude", "bun"). Para desligar:
# set -g pane-border-status off
set -g pane-border-status top               # título na borda de cima de cada painel
set -g pane-border-format "#{?pane_active,#[fg=#{@herdr-mauve}]#[bold],#[fg=#{@herdr-overlay0}]} #{pane_current_command} "
set -g display-panes-time 2000              # números dos painéis ficam 2s na tela
set -gF display-panes-colour "#{@herdr-overlay0}"           # números dos outros painéis
set -gF display-panes-active-colour "#{@herdr-mauve}"       # número do painel atual

# ┌────────────────────────────────────────────────────────────────────────────┐
# │ Mensagens e modos                                                          │
# └────────────────────────────────────────────────────────────────────────────┘
set -gF message-style "fg=#{@herdr-text},bg=#{@herdr-surface0}"             # avisos do tmux
set -gF message-command-style "fg=#{@herdr-mauve},bg=#{@herdr-surface0}"    # linha de comando (prefixo + :)
set -gF mode-style "fg=#{@herdr-crust},bg=#{@herdr-mauve}"                  # seleção no modo de cópia
set -gF copy-mode-match-style "fg=#{@herdr-crust},bg=#{@herdr-subtext0}"    # resultados da busca
set -gF copy-mode-current-match-style "fg=#{@herdr-crust},bg=#{@herdr-yellow}"   # resultado atual da busca
set -gF clock-mode-colour "#{@herdr-mauve}"  # cor do relógio (prefixo + t)
set -g clock-mode-style 24                  # relógio em 24h
