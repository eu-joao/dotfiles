# Herdr-inspired Tmux Theme
# Uses Catppuccin Mocha palette (dark mode)
# Matching herdr.dev's "ink" mode aesthetic

# Load color definitions
source-file ~/.tmux/themes/herdr.colors

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

# Enable true color support (required for Catppuccin colors)
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar refresh interval (1 second)
set -g status-interval 1

# Enable status bar and position at top (to match your existing config)
set -g status on
set -g status-position top
set -g status-justify left

# ============================================================================
# STATUS BAR STYLING
# ============================================================================

# Status bar style (background and foreground)
set -g status-style "fg=#{@herdr-status-fg},bg=#{@herdr-status-bg}"

# Left side length and style
set -g status-left-length 40
set -g status-left-style "fg=#{@herdr-accent},bg=#{@herdr-status-bg},bold"

# Right side length and style
set -g status-right-length 100
set -g status-right-style "fg=#{@herdr-status-fg},bg=#{@herdr-status-bg}"

# ============================================================================
# STATUS BAR CONTENT
# ============================================================================

# Left side: Prefix indicator (Herdr-like minimal design)
# Uses powerline-style separator () for clean look
set -g status-left "#[fg=#{@herdr-bg},bg=#{@herdr-accent}] #[fg=#{@herdr-accent},bg=#{@herdr-status-bg}]#[fg=#{@herdr-status-fg},bg=#{@herdr-status-bg}] #{?client_prefix,[#[fg=#{@herdr-red}]✗#[fg=#{@herdr-status-fg}],}#{prefix} "

# Right side: Window info, time, date, hostname
# Herdr-inspired clean layout with subtle separators
set -g status-right "#[fg=#{@herdr-accent2}]#{window_index} #[fg=#{@herdr-status-fg}]#{window_name} #[fg=#{@herdr-surface2}]│ #[fg=#{@herdr-time-fg}]%H:%M #[fg=#{@herdr-surface2}]│ #[fg=#{@herdr-date-fg}]%d-%b-%y #[fg=#{@herdr-surface2}]│ #[fg=#{@herdr-host-fg}]#{hostname}"

# ============================================================================
# WINDOW STYLING
# ============================================================================

# Active window style (current window) - highlighted in blue
set -g window-status-current-style "fg=#{@herdr-crust},bg=#{@herdr-accent},bold"
set -g window-status-current-format "#[fg=#{@herdr-crust},bg=#{@herdr-accent}] #{window_index} #[fg=#{@herdr-accent},bg=#{@herdr-status-bg}]#{window_name}#[default]"

# Inactive window style - subtle and clean
set -g window-status-style "fg=#{@herdr-subtext0},bg=#{@herdr-status-bg}"
set -g window-status-format "#[fg=#{@herdr-subtext0},bg=#{@herdr-status-bg}] #{window_index} #{window_name}#[default]"

# ============================================================================
# PANE STYLING
# ============================================================================

# Pane border style (subtle, Herdr-like)
set -g pane-border-style "fg=#{@herdr-pane-border},bg=#{@herdr-status-bg}"

# Active pane border (highlighted)
set -g pane-active-border-style "fg=#{@herdr-pane-active},bg=#{@herdr-status-bg}"

# Pane numbering
set -g display-panes-time 2000
set -g display-panes-colour "#{@herdr-accent}"

# ============================================================================
# MESSAGE AND MODE STYLING
# ============================================================================

# Command mode style (matches Herdr's clean aesthetic)
set -g mode-style "fg=#{@herdr-crust},bg=#{@herdr-accent},bold"

# Message style
set -g message-style "fg=#{@herdr-crust},bg=#{@herdr-accent}"

# Command message style
set -g message-command-style "fg=#{@herdr-yellow},bg=#{@herdr-surface0}"

# ============================================================================
# OTHER UI ELEMENTS
# ============================================================================

# Clock mode style
set -g clock-mode-colour "#{@herdr-accent}"
set -g clock-mode-style "fg=#{@herdr-crust},bg=#{@herdr-accent},bold"

# Copy mode style
set -g copy-mode-style "fg=#{@herdr-crust},bg=#{@herdr-yellow}"
